# Demo deploy: the sample church only. In Render: New → Blueprint → pick this repo,
# then set "Blueprint path" to render.demo.yaml. Nothing here touches a real church.
databases:
  - name: church-demo-db
    plan: basic-256mb
    databaseName: church_demo
    user: church_demo

services:
  - type: web
    name: church-demo
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DEPLOY_ENV
        value: staging
      - key: DEMO_MODE
        value: "true"
      - key: VITE_DEMO_MODE
        value: "true"
      - key: SANCTUM_MODE
        value: product
      - key: DEMO_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: church-demo-db
          property: connectionString
      # APP_URL is optional here: Render's own address (RENDER_EXTERNAL_URL) is used until you add a custom domain.
